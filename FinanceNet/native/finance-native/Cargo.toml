[package]
name = "finance-native"
version = "0.3.0"
edition = "2021"
description = "Rust accelerators for Finance.Net (C ABI). Dibuat oleh Gravicode Studios dipimpin oleh Kang Fadhil."
license = "MIT"
authors = ["Gravicode Studios"]
publish = false

[lib]
name = "finance_native"
crate-type = ["cdylib", "rlib"]

# No dependencies on purpose: the crate builds offline and the C ABI stays small.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
